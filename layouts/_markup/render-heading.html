{{- /* The anchor's glyph is aria-hidden so the heading's accessible name stays
       "The token layer" rather than "The token layer #" — screen-reader users
       hear the label on the link instead. */ -}}
<h{{ .Level }} id="{{ .Anchor }}">
  {{ .Text }}
  <a class="heading-anchor" href="#{{ .Anchor }}" aria-label="{{ printf "Link to %s" (.PlainText | plainify) }}"><span aria-hidden="true">#</span></a>
</h{{ .Level }}>
